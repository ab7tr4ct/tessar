[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tessar-core = { path = "crates/core" }
tessar-journal = { path = "crates/journal" }
tessar-embed-llama = { path = "crates/embed-llama" }
cmake = "0.1.58"
crc32fast = "1.5"
cxx = "1.0.205"
cxx-build = "1.0.205"
proptest = "1.9"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.23"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
ureq = { version = "3.5.1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
