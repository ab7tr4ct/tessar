[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
tessar-core = { path = "crates/core" }
tessar-journal = { path = "crates/journal" }
tessar-embed-llama = { path = "crates/embed-llama" }
tessar-embed-cache = { path = "crates/embed-cache" }
tessar-embed-candle = { path = "crates/embed-candle" }
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
cmake = "0.1.58"
crc32fast = "1.5"
cxx = "1.0.205"
cxx-build = "1.0.205"
proptest = "1.9"
rmcp = { version = "3.9.0", features = ["server", "client", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "net", "signal", "time", "sync", "macros"] }
ureq = { version = "3.5.1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
