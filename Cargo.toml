[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Checked with `cargo +1.89 check --locked` on the published crates; 1.88 lacks `File::lock`.
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/ab7tr4ct/tessar"
# Only the crates that `cargo install tessar` needs override this; see their manifests.
publish = false

[workspace.dependencies]
tessar-core = { path = "crates/core", version = "0.1.0" }
tessar-journal = { path = "crates/journal", version = "0.1.0" }
tessar-embed-llama = { path = "crates/embed-llama" }
tessar-embed-cache = { path = "crates/embed-cache", version = "0.1.0" }
tessar-embed-candle = { path = "crates/embed-candle", version = "0.1.0" }
candle-core = "0.11"
candle-nn = "0.11"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
cmake = "0.1.58"
crc32fast = "1.5"
cxx = "1.0.205"
cxx-build = "1.0.205"
proptest = "1.9"
rmcp = { version = "3.9.0", features = ["server", "client", "transport-io", "macros"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "io-util", "net", "signal", "time", "sync", "macros"] }
ureq = { version = "3.5.1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
