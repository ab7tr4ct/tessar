[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
tessar-core = { path = "crates/core" }
crc32fast = "1.5"
proptest = "1.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.23"
thiserror = "2.0.21"
ureq = { version = "3.5.1", features = ["json"] }

[workspace.lints.rust]
unsafe_code = "forbid"
