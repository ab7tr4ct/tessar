[package]
name = "tessar"
description = "MCP server for tessar: memory for Claude Code and other agents over stdio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["mcp","memory","agents","claude","ai"]
categories = ["command-line-utilities"]

[lib]
name = "tessar_mcp"

[[bin]]
name = "tessar"
path = "src/main.rs"

[features]
default = ["candle"]
# Pure-Rust embedder (Metal on macOS, CPU elsewhere); no C++ toolchain.
candle = ["dep:tessar-embed-candle"]

[dependencies]
tessar-core.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tessar-journal.workspace = true
tessar-embed-cache.workspace = true
sha2.workspace = true
rmcp.workspace = true
tokio.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tessar-embed-candle = { workspace = true, features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tessar-embed-candle = { workspace = true, optional = true }

[dev-dependencies]
tessar-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["process", "test-util"] }

[lints]
workspace = true
