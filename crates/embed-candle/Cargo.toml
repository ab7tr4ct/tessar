[package]
name = "tessar-embed-candle"
description = "Pure-Rust in-process embedder for tessar: voyage-4-nano on candle, no cmake"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["embeddings","candle","voyage","ai","inference"]
categories = ["science"]

# The experiment log is for the repository, not the package.
exclude = ["EXPERIMENT.md"]

[features]
default = []
metal = ["candle-core/metal", "candle-nn/metal"]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]

[dependencies]
tessar-core.workspace = true
candle-core.workspace = true
candle-nn.workspace = true
tokenizers.workspace = true
serde.workspace = true
serde_json.workspace = true
half = "2"

[lints]
workspace = true
